<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UG-ARBITRAGE | Live Sure Bet Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { arb: { green: '#10b981', darkGreen: '#059669', gold: '#f59e0b' } }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pulse-live { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-gray-900/90 border-b border-gray-800 px-4 py-3 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center font-black text-gray-950 text-lg shadow-lg">UG</div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-extrabold text-lg text-white">UGARH <span class="text-emerald-400">ARB SCANNER</span></h1>
                        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-live"></span> LIVE ENGINE ACTIVE
                        </span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="fetchLiveArbs()" id="scanBtn" class="bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-extrabold px-3 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/10 flex items-center gap-1.5 font-mono">
                    <svg id="scanIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Fetch Live Feed</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Stake Calculator Panel -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between">
                <span class="text-xs font-mono text-emerald-400 font-bold uppercase tracking-wide">💰 Stake Calculator (UGX)</span>
                <span class="text-[10px] text-gray-400 font-mono">Formula: Sum(1 / Odds) < 1.0</span>
            </div>
            <div class="flex items-center gap-3">
                <input type="number" id="totalStakeInput" value="100000" oninput="renderArbFeed()" class="w-full bg-gray-950 border border-gray-800 text-white text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-500 font-mono font-bold">
                <div class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-2.5 rounded-xl text-xs font-mono font-bold whitespace-nowrap">
                    Total Stake
                </div>
            </div>
        </div>

        <!-- Opportunities Feed -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-live"></span> Verified Sure Bets Found (<span id="arbCount">0</span>)
                </h3>
                <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl font-mono font-bold">
                    Arbitrage Threshold: <100%
                </span>
            </div>

            <div class="grid grid-cols-1 gap-4" id="arbitrageFeedContainer">
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center space-y-3">
                    <div class="inline-block w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-gray-400 font-mono">Connecting to multi-bookmaker odds feed...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 px-4 text-center mt-auto">
        <p class="text-xs text-gray-400">
            Ugandan Market Arbitrage Engine • Real-Time Odds Normalization
        </p>
    </footer>

    <script>
        // Active data store holding verified cross-bookmaker arb opportunities
        let liveArbsData = [];

        async function fetchLiveArbs() {
            const icon = document.getElementById('scanIcon');
            icon.classList.add('animate-spin');
            
            const container = document.getElementById('arbitrageFeedContainer');
            container.innerHTML = `
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center space-y-3">
                    <div class="inline-block w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-gray-400 font-mono">Scanning live bookmaker markets across Uganda...</p>
                </div>
            `;

            // Simulating API latency / backend response from live aggregator server
            setTimeout(() => {
                liveArbsData = [
                    {
                        league: "English Premier League",
                        match: "Manchester United vs Liverpool",
                        time: "Today, 19:00",
                        market: "Full Time Result (1X2)",
                        bookieA: "BetPawa UG",
                        pickA: "Home Win (1)",
                        oddsA: 2.35,
                        bookieB: "22Bet Uganda",
                        pickB: "Draw / Away (X2)",
                        oddsB: 1.88,
                        impliedSum: 0.958, // < 1.0 confirms true arbitrage
                        profitMargin: 4.38
                    },
                    {
                        league: "Spanish La Liga",
                        match: "Barcelona vs Real Madrid",
                        time: "Tomorrow, 21:00",
                        market: "Both Teams To Score (BTTS)",
                        bookieA: "Gal Sport Betting",
                        pickA: "BTTS Yes",
                        oddsA: 1.85,
                        bookieB: "Fortebet UG",
                        pickB: "BTTS No",
                        oddsB: 2.25,
                        impliedSum: 0.985,
                        profitMargin: 1.52
                    }
                ];
                icon.classList.remove('animate-spin');
                renderArbFeed();
            }, 800);
        }

        function renderArbFeed() {
            const container = document.getElementById('arbitrageFeedContainer');
            const totalStake = parseFloat(document.getElementById('totalStakeInput').value) || 100000;
            document.getElementById('arbCount').textContent = liveArbsData.length;

            if (liveArbsData.length === 0) {
                container.innerHTML = `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center text-xs text-gray-400">No active arbitrage opportunities found at this moment.</div>`;
                return;
            }

            let html = "";
            liveArbsData.forEach(arb => {
                // Strict mathematical arbitrage stake calculation formula: Stake = Total * (ImpliedProbability / SumOfImpliedProbabilities)
                const impliedA = 1 / arb.oddsA;
                const impliedB = 1 / arb.oddsB;
                const totalImplied = impliedA + impliedB;

                const stakeA = Math.round(totalStake * (impliedA / totalImplied));
                const stakeB = Math.round(totalStake * (impliedB / totalImplied));
                
                const guaranteedReturnA = Math.round(stakeA * arb.oddsA);
                const guaranteedReturnB = Math.round(stakeB * arb.oddsB);
                
                // Both outcomes yield identical guaranteed payouts in true arbitrage math
                const avgPayout = guaranteedReturnA; 
                const netProfit = avgPayout - totalStake;

                html += `
                    <div class="bg-gradient-to-br from-gray-900 to-gray-900/90 border-2 border-emerald-500/40 rounded-2xl p-5 space-y-4 shadow-xl">
                        <div class="flex items-center justify-between text-xs text-amber-400 font-mono font-bold">
                            <span>🏆 ${arb.league} • ${arb.time}</span>
                            <span class="bg-emerald-500 text-gray-950 px-2.5 py-0.5 rounded-lg text-xs font-mono font-black">+${arb.profitMargin}% PROFIT</span>
                        </div>
                        
                        <div class="font-extrabold text-base text-white">
                            ${arb.match}
                        </div>
                        <div class="text-[11px] text-gray-400 font-mono">Market: <span class="text-white">${arb.market}</span> | Arb Index: <span class="text-emerald-400">${arb.impliedSum}</span></div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                            <!-- Leg 1 -->
                            <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 space-y-1.5">
                                <div class="flex justify-between text-[11px] font-mono">
                                    <span class="text-emerald-400 font-bold">${arb.bookieA}</span>
                                    <span class="text-white font-bold">@ ${arb.oddsA}</span>
                                </div>
                                <div class="text-xs text-gray-300 font-bold">${arb.pickA}</div>
                                <div class="text-[10px] text-gray-400 font-mono pt-1 border-t border-gray-900">
                                    Exact Stake: <strong class="text-amber-400">${Number(stakeA).toLocaleString()} UGX</strong>
                                </div>
                            </div>

                            <!-- Leg 2 -->
                            <div class="bg-gray-950 border border-gray-800 rounded-xl p-3 space-y-1.5">
                                <div class="flex justify-between text-[11px] font-mono">
                                    <span class="text-emerald-400 font-bold">${arb.bookieB}</span>
                                    <span class="text-white font-bold">@ ${arb.oddsB}</span>
                                </div>
                                <div class="text-xs text-gray-300 font-bold">${arb.pickB}</div>
                                <div class="text-[10px] text-gray-400 font-mono pt-1 border-t border-gray-900">
                                    Exact Stake: <strong class="text-amber-400">${Number(stakeB).toLocaleString()} UGX</strong>
                                </div>
                            </div>
                        </div>

                        <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 flex items-center justify-between text-xs font-mono">
                            <div>Guaranteed Payout: <span class="text-white font-bold">${Number(avgPayout).toLocaleString()} UGX</span></div>
                            <div>Net Profit: <span class="text-emerald-400 font-extrabold">+${Number(netProfit).toLocaleString()} UGX</span></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchLiveArbs();
        });
    </script>
</body>
</html>
